<style>
:root{--bg:#f4fbfa;--card:#fff;--ink:#0d1f3c;--mut:#51627a;--teal:#0f9b92;--gold:#e0a82e;--line:#d5e6e4}
@media (prefers-color-scheme:dark){:root{--bg:#08141f;--card:#0f2233;--ink:#eaf6f5;--mut:#9bb3bd;--teal:#25c2b7;--line:#1c3646}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 18px 40px -22px rgba(13,31,60,.5);text-align:center}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}.logo b{color:var(--gold)}
h1{font-size:1.2rem;margin:18px 0 6px}p{color:var(--mut);margin:0 0 20px;font-size:.93rem;line-height:1.5}
input{width:100%;font:600 1.1rem ui-monospace,Menlo,monospace;letter-spacing:.08em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);text-transform:uppercase}
input:focus{outline:none;border-color:var(--teal)}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:700 1rem system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin-top:12px;font-size:.9rem;color:#c0392b}
small{display:block;margin-top:14px;color:var(--mut);font-size:.8rem}
